name: Windows Cloud PC - AnyDesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Downloading and Installing Essentials
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/dr310yfyg0ti6mwano3fv/Downloads.bat?rlkey=a2wbeiel73ra5i0nsdd6ud9qr&st=r26jd007&dl=1" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: Log In To AnyDesk
        shell: powershell
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
          } else {
            Write-Host "start.bat not found."
          }

      - name: Monitor AnyDesk
        shell: powershell
        run: |
          while ($true) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

            if (-not $process) {
              Write-Host "AnyDesk is not running."
              if (Test-Path "start.bat") {
                cmd /c start.bat
              }
            }

            Start-Sleep -Seconds 300
          }
          
